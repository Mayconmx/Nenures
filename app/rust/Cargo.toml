[package]
name = "nenures_core"
version = "0.1.0"
edition = "2024"
publish = false
license = "LicenseRef-pendente-D15"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
openmls = "=0.9.1"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
argon2 = "=0.6.0"
hkdf = "=0.13.0"
sha2 = "=0.11.1"
chacha20poly1305 = "=0.10.1"
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
