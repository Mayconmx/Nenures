name: nenures
description: "Conversas temporarias, sem cadastro."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  camera: 0.12.1
  clock: 1.1.2
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_rust_bridge: 2.13.0
  nenures_core:
    path: rust_builder
  qr: 4.0.0
  zxing2: 0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: 1.3.3

flutter:
  # Os ícones do app vêm de NenuresSymbols (Material Symbols Rounded recortado).
  # Material Icons fica ligado só porque widgets do framework o usam; o tree-shaking
  # do build de release reduz a fonte aos poucos glifos efetivamente referenciados.
  uses-material-design: true

  # Fontes empacotadas no app; nada é baixado em tempo de execução.
  # Origem e licenças: assets/fonts/README.md
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Variable.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: NenuresSymbols
      fonts:
        - asset: assets/fonts/NenuresSymbols.ttf
