include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Nada de print: logs podem vazar convite ou mensagens (revisao-seguranca.md, seção 5).
    avoid_print: error
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - rust_builder/**
    # Gerado pelo flutter_rust_bridge_codegen; não editar à mão.
    - lib/src/rust/**

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
