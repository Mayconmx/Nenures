name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: sh ../tools/check_forbidden_deps.sh pubspec.lock
      - name: build release (assinado com chave de debug até a Fase 9)
        run: flutter build apk --release
      - name: transporte falso fora do release
        run: sh ../tools/check_release_apk.sh build/app/outputs/flutter-apk/app-release.apk
      - name: controle positivo (build da demonstração contém o transporte falso)
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/release.apk
          flutter build apk --release -t test/demo/main_demo.dart
          sh ../tools/check_release_apk.sh --expect build/app/outputs/flutter-apk/app-release.apk
          sh ../tools/check_release_apk.sh /tmp/release.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
